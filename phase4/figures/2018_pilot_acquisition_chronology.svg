<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b3a}.title{font-size:22px;font-weight:bold}.subtitle{font-size:13px}.lane{font-size:14px;font-weight:bold}.tick{font-size:13px}.label{font-size:12px}.note{font-size:12px;fill:#3a5260}.grid{stroke:#d9e2e8;stroke-width:1}.axis{stroke:#6b7b87;stroke-width:1.2}</style>
<text x="35.0" y="42" text-anchor="start" class="title">Sentinel-1 acquisitions and dated flood products, Kerala pilot</text>
<text x="35.0" y="65" text-anchor="start" class="subtitle">Pilot: 76.35–76.60°E, 9.45–9.75°N · acquisition dates in IST</text>
