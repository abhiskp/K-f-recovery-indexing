<text x="35.0" y="402" text-anchor="start" class="note">Circles = one acquisition (often two adjacent granules); filled blue = reference candidate, orange = dated event/check.</text>
<text x="35.0" y="423" text-anchor="start" class="note">Diamonds = dated NRSC products. The 16 July product documents July flooding; June/4 July dry status is unverified.</text>
<text x="35.0" y="444" text-anchor="start" class="note">9 and 21 August are separate observations. Matching orbit does not prove flood causation or independent label agreement.</text>
<text x="35.0" y="480" text-anchor="start" class="note">Sources: Earth Engine COPERNICUS/S1_GRD inventory; NRSC/NDEM dated products (see phase4/sources.md).</text>
